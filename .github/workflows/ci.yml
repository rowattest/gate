name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: check every vector with the built bundle
        run: |
          fail=0
          while read -r file want; do
            [ -z "$file" ] && continue
            node dist/rowattest-gate.js check "test/vectors/$file" > /dev/null
            got=$?
            if [ "$got" = "$want" ]; then echo "ok   $file exit $got"; else echo "FAIL $file exit $got, expected $want"; fail=1; fi
          done < test/vectors/expected-exit.txt
          exit $fail
