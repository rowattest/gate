name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: check every vector with the built bundle
        run: |
          fail=0
          while read -r file want; do
            [ -z "$file" ] && continue
            node dist/rowattest-gate.js check "test/vectors/$file" > /dev/null
            got=$?
            if [ "$got" = "$want" ]; then echo "ok   $file exit $got"; else echo "FAIL $file exit $got, expected $want"; fail=1; fi
          done < test/vectors/expected-exit.txt
          exit $fail
